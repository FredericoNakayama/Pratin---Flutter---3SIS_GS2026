name: pratin
description: "Pratin - conecta estabelecimentos a ONGs para doar alimentos próximos do vencimento."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Requisições REST ao MockAPI.
  http: ^1.6.0
  # Persistência local: onboarding, perfil e favoritos.
  shared_preferences: ^2.5.6
  # Formatação de datas. Versão fixada pelo flutter_localizations.
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
